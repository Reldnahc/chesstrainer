[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chess-trainer"
version = "0.1.0"
description = "Local-first, evidence-based chess curriculum and retention"
requires-python = ">=3.12"
license = "GPL-3.0-or-later AND AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "python-chess==1.999", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "fsrs==6.3.2", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
human = ["numpy==2.2.6", "torch==2.8.0"]

[project.scripts]
chess-trainer = "trainer.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["stockfish: requires native Stockfish", "maia: requires opt-in pinned Maia runtime and cached checkpoint"]

[tool.ruff]
extend-exclude = ["backend/trainer/_vendor/lichess_puzzler", "backend/trainer/_vendor/maia3"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"trainer.human_models" = ["manifest.json"]
"trainer._vendor.maia3" = ["LICENSE", "README.md"]
"trainer._vendor.lichess_puzzler" = ["LICENSE", "UPSTREAM.json", "README.md"]
"trainer._vendor.lichess_accuracy" = ["LICENSE.*", "README.md"]
"trainer._vendor.lichess_openings" = ["*.tsv", "COPYING.txt", "UPSTREAM.json", "README.md"]
