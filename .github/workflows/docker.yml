name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites regardless of changes since the last successful release
        type: boolean
        default: true

permissions:
  contents: read

# A newer release must not race an older image's update of the latest tag.
concurrency:
  group: fieldwork-release
  cancel-in-progress: false

jobs:
  release-base:
    name: Find verified release baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.baseline.outputs.base }}
      full: ${{ steps.baseline.outputs.full }}
      docker: ${{ steps.plan.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Include changes from failed or superseded releases
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python scripts/ci_release_base.py
      - name: Decide whether the shipped image changed
        id: plan
        env:
          CI_BASE: ${{ steps.baseline.outputs.base }}
          CI_FULL: ${{ steps.baseline.outputs.full }}
        # Mirrors the correctness selection below, so the image is rebuilt whenever
        # anything it ships changed since the last successful release.
        run: |
          if [ "$CI_FULL" != "false" ] || [ -z "$CI_BASE" ]; then
            python scripts/ci_plan.py --full
          else
            python scripts/ci_plan.py --base "$CI_BASE" --head HEAD
          fi

  correctness:
    needs: release-base
    uses: ./.github/workflows/test.yml
    with:
      base: ${{ needs.release-base.outputs.base }}
      # Missing/malformed baseline outputs must never fall back to the last push.
      full: ${{ needs.release-base.outputs.full != 'false' || needs.release-base.outputs.base == '' }}
      skip_docker_install: true

  image:
    name: Build and smoke-test the image
    needs: release-base
    # Runs alongside correctness. The candidate is pushed by digest only, with no
    # tag, so nothing pulls it by name until the publish job below tags it.
    # Missing plan output fails safe toward building.
    if: github.ref == 'refs/heads/main' && needs.release-base.outputs.docker != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the release candidate and push it by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          outputs: type=image,name=ghcr.io/reldnahc/chesstrainer,name-canonical=true,push-by-digest=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/Reldnahc/chesstrainer
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=max
      - name: Smoke-test the exact candidate by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          docker pull "ghcr.io/reldnahc/chesstrainer@$DIGEST"
          python scripts/smoke_install.py --image "ghcr.io/reldnahc/chesstrainer@$DIGEST"

  docker:
    name: Publish the tested image
    needs: [release-base, correctness, image]
    # Manual runs from another branch are tested but must never replace the latest image.
    # Changes that ship nothing new (tests, studios, docs) keep the current image.
    if: github.ref == 'refs/heads/main' && needs.release-base.outputs.docker != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the smoke-tested digest as the commit and latest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          COMMIT_TAG: ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
        # The manifest is already in the registry, so this moves no layers and
        # publishes byte for byte the image the smoke test ran.
        run: |
          test -n "$DIGEST"
          docker buildx imagetools create --tag "$COMMIT_TAG" --tag ghcr.io/reldnahc/chesstrainer:latest \
            "ghcr.io/reldnahc/chesstrainer@$DIGEST"
          docker buildx imagetools inspect "$COMMIT_TAG" | grep -F "$DIGEST"
