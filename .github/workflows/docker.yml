name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    uses: ./.github/workflows/test.yml

  docker:
    needs: correctness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reldnahc/chesstrainer:latest
            ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Reldnahc/chesstrainer
            org.opencontainers.image.revision=${{ github.sha }}
