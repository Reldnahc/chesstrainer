[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-chess-trainer"
version = "0.1.0"
description = "Local-first, evidence-based chess curriculum and retention"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "python-chess==1.999", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "openai>=2,<3", "fsrs==6.3.2", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
chess-trainer = "trainer.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = ["stockfish: requires native Stockfish", "live_llm: opt-in paid API test"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
