anation\">\u003cdiv class=\"explanation-controls\" role=\"group\" aria-label=\"Continuation playback\">\u003cbutton aria-label=\"Previous move\" >\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003cspan>2 / 6 - Nf3\u003c/span>\u003cbutton aria-label=\"Next move\" >\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/section>\u003c/div>","note":"At least 54px wide × 44px high; 20px chevrons; counter includes the move SAN and says “Start” at ply zero. Escape closes the explanation.","wrapper":"review-page"},{"key":"C","label":"Lesson illustrative game","source":"frontend/src/study/LessonPlayer.tsx:45","html":"\u003cdiv class=\"lesson-board-controls\">\u003ca class=\"button-link secondary\" href=\"/study/openings\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-left\" aria-hidden=\"true\">\u003cpath d=\"m12 19-7-7 7-7\">\u003c/path>\u003cpath d=\"M19 12H5\">\u003c/path>\u003c/svg>Chapters\u003c/a>\u003cdiv class=\"lesson-game-controls\">\u003cbutton aria-label=\"Previous game move\" aria-disabled=\"false\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003cspan>8 / 42\u003c/span>\u003cbutton aria-label=\"Next game move\" aria-disabled=\"false\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>","note":"18px chevrons, 11px monospace counter. Pending navigation uses aria-disabled while the session hook locks commands, preserving focus and avoiding dimming each move.","code":"const gameButtonState = (atBoundary = false) => ({\n  disabled: !!error || atBoundary,\n  \"aria-disabled\": gameNavigationDisabled || atBoundary\n});","wrapper":"review-page"},{"key":"D","label":"Opening line preview","source":"frontend/src/study/OpeningLinePreview.tsx:83","html":"\u003cdiv class=\"lesson-board-controls\">\u003ca class=\"button-link secondary\" href=\"/study/openings/catalogue\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-left\" aria-hidden=\"true\">\u003cpath d=\"m12 19-7-7 7-7\">\u003c/path>\u003cpath d=\"M19 12H5\">\u003c/path>\u003c/svg>Back\u003c/a>\u003cdiv class=\"lesson-game-controls\">\u003cbutton aria-label=\"Previous line move\" >\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003cspan>8 / 14\u003c/span>\u003cbutton aria-label=\"Next line move\" >\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>","note":"Same lesson CSS and almost identical markup. Local state changes ply immediately; previous/next use native disabled only at the line boundaries.","code":"\u003cbutton aria-label=\"Previous line move\" disabled={!ply}\n  onClick={() => setPly(value => value - 1)}>…\u003c/button>","wrapper":"review-page"}],"options":[{"value":"promoteA","label":"Promote A · Game review layout"},{"value":"promoteB","label":"Promote B · Explanation layout"},{"value":"promoteC","label":"Promote C/D · Lesson and opening layout"},{"value":"sharedVariants","label":"Share controls with explicit layout variants"},{"value":"keep","label":"Keep the current variants"}],"recommendation":"Select geometry, then share controlled playback markup with optional first/last/flip and surrounding actions. Preserve every mode’s state and pending-command policy."},{"id":6,"title":"Pagination","kind":"Appearance","difference":"Games uses text-only “Previous games / More games,” a 10px gap and phone wrapping. Catalogue uses chevrons, “Previous / Next,” an 8px gap and different spacing.","examples":[{"key":"A","label":"Games pagination","source":"frontend/src/GameReview.tsx:98","html":"\u003cdiv class=\"workspace-page\">\u003cdiv class=\"game-pagination\">\u003cbutton>Previous games\u003c/button>\u003cspan>31–60 of 126\u003c/span>\u003cbutton>More games\u003c/button>\u003c/div>\u003c/div>","note":"30-game pages. The first-page Previous button is disabled. The next action calls navigatePage(gamesPath(page + 1)). Styles: game-history.css:180; phone wrapping at :263.","wrapper":"workspace-page"},{"key":"B","label":"Opening catalogue pagination","source":"frontend/src/study/OpeningCatalogue.tsx:39","html":"\u003cdiv class=\"workspace-page\">\u003cdiv class=\"opening-pagination\">\u003cbutton>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left\" aria-hidden=\"true\">\u003cpath d=\"m15 18-6-6 6-6\">\u003c/path>\u003c/svg>Previous\u003c/button>\u003cspan>51–100 of 126\u003c/span>\u003cbutton>Next\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>","note":"50-line pages with current search parameters retained. 16px chevrons; the range is muted. Styles: study/study.css:76.","wrapper":"workspace-page"}],"options":[{"value":"promoteA","label":"Promote A · Games labels/layout"},{"value":"promoteB","label":"Promote B · Catalogue labels/layout"},{"value":"keep","label":"Keep the current variants"}],"recommendation":"Promote one pagination presentation and use destination links where appropriate. Preserve page sizes, filters, totals and empty-page recovery."},{"id":7,"title":"Selectable continuation moves","kind":"Behavior","difference":"Puzzle and opening continuation buttons already share styling. Puzzle omits move numbers and disables all buttons during playback; opening shows full-move numbers and changes a local ply.","examples":[{"key":"A","label":"Completed puzzle continuation","source":"frontend/src/study/PuzzlePlayer.tsx:84","html":"\u003cdiv class=\"puzzle-move-list\">\u003cbutton>Start\u003c/button>\u003cbutton>Bxh7+\u003c/button>\u003cbutton aria-current=\"step\">Kxh7\u003c/button>\u003cbutton>Ng5+\u003c/button>\u003cbutton>Kg8\u003c/button>\u003cbutton>Qh5\u003c/button>\u003c/div>","note":"Static stopped-playback fixture. During playback every button is disabled. SAN labels have no move numbering. Selection compares the current frame with the solution move.","code":"\u003cbutton disabled={playing}\n  aria-current={frame === move ? \"step\" : undefined}\n  onClick={() => state.inspect(move)}>{move.san}\u003c/button>","wrapper":"review-page"},{"key":"B","label":"Opening line continuation","source":"frontend/src/study/OpeningLinePreview.tsx:94","html":"\u003cdiv class=\"puzzle-move-list\">\u003cbutton>Start\u003c/button>\u003cbutton>1. e4\u003c/button>\u003cbutton aria-current=\"step\">1… e5\u003c/button>\u003cbutton>2. Nf3\u003c/button>\u003cbutton>2… Nc6\u003c/button>\u003cbutton>3. Bb5\u003c/button>\u003c/div>","note":"Same 36px minimum button CSS, 6px gap and orange selected border. Number and side come from each position’s FEN; selection is ply === index + 1.","code":"\u003cbutton aria-current={ply === index + 1 ? \"step\" : undefined}\n  onClick={() => setPly(index + 1)}>\n  {move.before_fen.split(\" \")[5]}\n  {move.before_fen.split(\" \")[1] === \"w\" ? \".\" : \"…\"} {move.san}\n\u003c/button>","wrapper":"review-page"}],"options":[{"value":"sharedVariants","label":"Share markup; preserve numbering and playback rules"},{"value":"promoteA","label":"Prefer A · SAN-only labels"},{"value":"promoteB","label":"Prefer B · Numbered move labels"},{"value":"keep","label":"Keep the current implementations"}],"recommendation":"One controlled continuation component can preserve both numbering and playback-disabled inputs. No visual redesign is necessary."},{"id":8,"title":"Move feedback and announcements","kind":"Behavior","difference":"Due uses MoveStatus with a 350ms checking delay, retry icon and atomic announcement. Puzzle announces busy text immediately. Lessons announce prompt plus a separately colored result paragraph.","examples":[{"key":"A","label":"Due · MoveStatus","source":"frontend/src/MoveStatus.tsx:6","html":"\u003cdiv class=\"review-session\">\u003cdiv class=\"coach-message\" tabindex=\"0\" aria-label=\"Coach explanation\">\u003cdiv role=\"status\" aria-live=\"polite\" aria-atomic=\"true\" class=\"move-status retry\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-rotate-ccw\" aria-hidden=\"true\">\u003cpath d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\">\u003c/path>\u003cpath d=\"M3 3v5h5\">\u003c/path>\u003c/svg>\u003cspan>Mistake. Try again.\u003c/span>\u003c/div>\u003c/div>\u003c/div>","note":"Shown with its default retry text. Actual Due callers can supply coaching text. Standalone MoveStatus has a minimum height; inside coach-message that minimum is removed because the shared speech layout reserves the space.","code":"const timer = window.setTimeout(() => setWaiting(true), 350);\nconst checking = busy && waiting;\n\u003cdiv role=\"status\" aria-live=\"polite\" aria-atomic=\"true\"\n  className={`move-status${failed && !checking ? \" retry\" : \"\"}`}>\n  {checking ? \"Checking your move...\" : failed ? … : …}\n\u003c/div>","wrapper":"review-page"},{"key":"B","label":"Puzzle · direct status paragraph","source":"frontend/src/study/PuzzlePlayer.tsx:80","html":"\u003cdiv class=\"coach-message\" tabindex=\"0\" aria-label=\"Coach explanation\">\u003cp role=\"status\" aria-live=\"polite\">That move does not solve this puzzle. Your earlier correct moves are saved.\u003c/p>\u003c/div>","note":"The same paragraph immediately says “Checking your move…” while busy and has distinct playback/solved/revealed text. No retry icon or explicit aria-atomic attribute.","code":"const message = error ? …\n  : busy ? \"Checking your move…\"\n  : playing ? \"The board is playing the verified line.\"\n  : …;\n\u003cp role=\"status\" aria-live=\"polite\">{message}\u003c/p>","wrapper":"review-page"},{"key":"C","label":"Lesson · prompt and result","source":"frontend/src/study/LessonPlayer.tsx:62","html":"\u003cdiv class=\"coach-message\" tabindex=\"0\" aria-label=\"Coach explanation\">\u003cdiv role=\"status\" aria-live=\"polite\">\u003cp>Develop a piece toward the center.\u003c/p>\u003cp class=\"lesson-feedback incorrect\">Try this lesson’s studied move.\u003c/p>\u003c/div>\u003c/div>","note":"Prompt and result are illustrative content from the step/feedback fields. Incorrect results are peach; correct results are green. Result hides during playback, full-game exploration and chapter completion.","code":"\u003cdiv role=\"status\" aria-live=\"polite\">\n  \u003cp>{… : step.text}\u003c/p>\n  {feedback && !playback.playing && !session.game && !finished &&\n    \u003cp className={`lesson-feedback ${feedback.kind}`}>{feedback.text}\u003c/p>}\n\u003c/div>","wrapper":"review-page"}],"options":[{"value":"promoteA","label":"Promote A · MoveStatus presentation"},{"value":"promoteB","label":"Promote B · Puzzle paragraph"},{"value":"promoteC","label":"Promote C · Lesson prompt/result layout"},{"value":"sharedVariants","label":"Share announcement rules; retain rich lesson layout"},{"value":"keep","label":"Keep the current variants"}],"recommendation":"Build from existing MoveStatus where useful, preserving rich lesson content and each mode’s outcomes. Checking delay and atomic announcements are behavior decisions, not visible in a still image."},{"id":9,"title":"Saved recall scheduling receipt","kind":"Behavior","difference":"Both owners use the same receipt CSS. Game recall shows a relative due time with an exact tooltip; opening recall shows the full locale date/time. Relearning and retirement wording are domain-specific.","examples":[{"key":"A","label":"Game recall · relative time","source":"frontend/src/srsReview/ReviewPanel.tsx:194","html":"\u003cdiv class=\"review-session\">\u003cdiv class=\"practice-panel\">\u003cdiv class=\"review-schedule\">\u003c tain compact activity/search variants"},{"value":"shared-variants","label":"Share section and compact empty-state variants without enlarging embedded rows"},{"value":"keep","label":"Keep the current implementations separate"},{"value":"defer","label":"Decide later"}],"recommendation":"Choose one section appearance from A, B or C/D, while retaining compact rows for E/G and caller-owned wording/actions for first-use versus recovery."},{"id":14,"title":"Provider username fields","kind":"Behavior","difference":"All three collect the same provider username with a 50-character limit. Connection and onboarding allow blank values; one-time import is required. Labels, helper text and disabled rules differ, and the help text is not explicitly connected with aria-describedby.","examples":[{"key":"A","label":"Remembered connection · optional username","source":"frontend/src/GameSync.tsx:26","context":"application","html":"\u003csection class=\"panel game-sync\" aria-label=\"Recent Chess.com games\">\u003ch3>Chess.com\u003c/h3>\u003cform class=\"sync-form\">\u003clabel>Username\u003cinput aria-label=\"Remembered Chess.com username\" value=\"sample-player\" maxlength=\"50\" pattern=\"[A-Za-z0-9_-]*\" autocomplete=\"off\" placeholder=\"Your Chess.com username\">\u003c/label>\u003cbutton>Save username\u003c/button>\u003c/form>\u003c/section>","wrapper":"workspace-page","code":"  const form = \u003cform className=\"sync-form\" onSubmit={submit}>\n    \u003clabel>Username\n      \u003cinput aria-label={`Remembered ${provider.name} username`} disabled={!status || busy} value={name} onChange={event => { edited.current = true; setName(event.target.value); }} maxLength={50} pattern=\"[A-Za-z0-9_-]*\" autoComplete=\"off\" placeholder={`Your ${provider.name} username`} />\n    \u003c/label>\n    \u003cbutton disabled={!status || busy}>Save username\u003c/button>\n  \u003c/form>;","note":"Pattern ends in * so empty is valid. Disabled while status is missing or save is busy. The aria-label specifies Remembered Chess.com username."},{"key":"B","label":"One-time provider import · required username","source":"frontend/src/ProviderImport.tsx:80","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import from Chess.com\u003c/h3>\u003cp class=\"small import-intro\">Bring in older games or a custom date range. This uses your saved username unless you enter a different one here. No login or API key needed.\u003c/p>\u003clabel>Chess.com username\u003cinput aria-label=\"Chess.com username\" autocomplete=\"off\" value=\"sample-player\" required maxlength=\"50\" pattern=\"[A-Za-z0-9_-]+\" placeholder=\"Your Chess.com username\">\u003csmall>Your side is identified separately in every game.\u003c/small>\u003c/label>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"    \u003cform className=\"panel form-panel\" onSubmit={submit}>\n      \u003ch3>Import from {provider.name}\u003c/h3>\n      \u003cp className=\"small import-intro\">\n        Bring in older games or a custom date range. This uses your saved username\n        unless you enter a different one here. No login or API key needed.\n      \u003c/p>\n      \u003clabel>\n        {provider.name} username\n        \u003cinput\n          aria-label={`${provider.name} username`}\n          disabled={loadingUsername}\n          autoComplete=\"off\"\n          value={username}\n          onChange={(e) => { editedUsername.current = true; setUsername(e.target.value); }}\n          required\n          maxLength={50}\n          pattern=\"[A-Za-z0-9_-]+\"\n          placeholder={`Your ${provider.name} username`}\n        />\n        \u003csmall>Your side is identified separately in every game.\u003c/small>\n      \u003c/label>","note":"Pattern ends in + and required is present. Disabled only while the remembered username loads. The small helper currently has no id/aria-describedby association."},{"key":"C","label":"Onboarding · explicit optional labels","source":"frontend/src/Onboarding.tsx:50","context":"application","html":"\u003cmain class=\"account-entry onboarding\">\u003csection class=\"panel\" aria-labelledby=\"onboarding-title\">\u003cp class=\"eyebrow\">WELCOME TO FIELDWORK · 1 OF 2\u003c/p>\u003ch1 id=\"onboarding-title\" tabindex=\"-1\">Where do you play?\u003c/h1>\u003cp>Add either username, both, or leave them blank. You can change them in Settings later.\u003c/p>\u003cform>\u003clabel>Chess.com username (optional)\u003cinput value=\"sample-player\" autocomplete=\"off\" maxlength=\"50\" pattern=\"[A-Za-z0-9_-]*\">\u003c/label>\u003clabel>Lichess username (optional)\u003cinput value=\"\" autocomplete=\"off\" maxlength=\"50\" pattern=\"[A-Za-z0-9_-]*\">\u003c/label>\u003cbutton class=\"primary\">Continue\u003c/button>\u003c/form>\u003c/section>\u003c/main>","wrapper":"","code":"  return \u003cmain className=\"account-entry onboarding\">\n    \u003csection className=\"panel\" aria-labelledby=\"onboarding-title\">\n      \u003cp className=\"eyebrow\">WELCOME TO FIELDWORK · {step} OF 2\u003c/p>\n      \u003ch1 id=\"onboarding-title\" ref={heading} tabIndex={-1}>{step === 1 ? \"Where do you play?\" : \"Bring in your first games\"}\u003c/h1>\n      {step === 1 ? \u003c>\n        \u003cp>Add either username, both, or leave them blank. You can change them in Settings later.\u003c/p>\n        \u003cform onSubmit={next}>\n          {connections.map(connection => \u003clabel key={connection.id}>\n            {connection.name} username (optional)\n            \u003cinput value={connection.username} disabled={busy || loading} autoComplete=\"off\" maxLength={50} pattern=\"[A-Za-z0-9_-]*\"\n              onChange={event => setConnections(values => values.map(value => value.id === connection.id ? { ...value, username: event.target.value } : value))} />\n          \u003c/label>)}\n          {loading && \u003cp role=\"status\">Loading connections…\u003c/p>}\n          \u003cbutton className=\"primary\" disabled={busy || loading}>{busy ? \"Saving…\" : \"Continue\"}\u003c/button>\n        \u003c/form>","note":"Native wrapping labels supply field names. Both are optional, disabled during loading or saving, and saved together by onboarding."},{"key":"D","label":"Connection editor · blank means disconnect","source":"frontend/src/GameSync.tsx:34","context":"application","html":"\u003csection class=\"panel game-sync\" aria-label=\"Recent Chess.com games\">\u003ch3>Chess.com\u003c/h3>\u003cstrong class=\"connection-username\">sample-player\u003c/strong>\u003cdetails open>\u003csummary>Change Chess.com connection\u003c/summary>\u003cform class=\"sync-form\">\u003clabel>Username\u003cinput aria-label=\"Remembered Chess.com username\" value=\"\" maxlength=\"50\" pattern=\"[A-Za-z0-9_-]*\" autocomplete=\"off\" placeholder=\"Your Chess.com username\">\u003c/label>\u003cbutton>Save username\u003c/button>\u003c/form>\u003cp class=\"small\">Clear the username to disconnect.\u003c/p>\u003c/details>\u003c/section>","wrapper":"workspace-page","code":"    {status?.username ? \u003c>\n      \u003cstrong className=\"connection-username\">{status.username}\u003c/strong>\n      \u003cdetails>\n        \u003csummary>Change {provider.name} connection\u003c/summary>\n        {form}\n        \u003cp className=\"small\">Clear the username to disconnect.\u003c/p>\n      \u003c/details>","note":"Static open-state sample. In production, the native disclosure toggles and saving an empty username disconnects the account; neither action runs here."}],"options":[{"value":"promote-A","label":"Promote A’s field layout with explicit required/import and optional variants"},{"value":"promote-B","label":"Promote B’s provider label/help layout with required and optional variants"},{"value":"shared-variants","label":"Share provider field rules while preserving required/optional and caller busy policy"},{"value":"keep","label":"Keep the current implementations separate"},{"value":"defer","label":"Decide later"}],"recommendation":"Share provider identity, validation and help/label conventions with required and optional variants. Keep account credentials, persistence and busy policy outside this field."},{"id":15,"title":"Import analysis option and action wording","kind":"Structure","difference":"PGN and provider forms already use the same checkbox class, label, arrow and conditional idle wording. The JSX is duplicated; busy copy intentionally differs. Onboarding still tells users to select “Fetch games,” which no longer matches the form action.","examples":[{"key":"A","label":"PGN · import only","source":"frontend/src/Import.tsx:190","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import PGN\u003c/h3>\u003clabel class=\"import-analysis-option\">\u003cinput type=\"checkbox\">Also analyze these games for training\u003c/label>\u003cbutton class=\"primary\">Import games\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/button>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"          \u003clabel className=\"import-analysis-option\">\n            \u003cinput type=\"checkbox\" checked={analyze} onChange={event => setAnalyze(event.target.checked)} />\n            Also analyze these games for training\n          \u003c/label>\n          \u003cbutton className=\"primary\" disabled={busy || (pgnMode === \"file\" ? !file : !text.trim())}>\n            {busy ? \"Importing…\" : analyze ? \"Import & analyze games\" : \"Import games\"}\u003cArrowRight size={17} />\n          \u003c/button>","note":"Static unchecked-state excerpt with a valid PGN selected. In production, changing the checkbox updates the action text; this specimen is inert."},{"key":"B","label":"Provider · import only","source":"frontend/src/ProviderImport.tsx:143","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import from Chess.com\u003c/h3>\u003clabel class=\"import-analysis-option\">\u003cinput type=\"checkbox\">Also analyze these games for training\u003c/label>\u003cbutton class=\"primary\">Import games\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/button>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"      \u003clabel className=\"import-analysis-option\">\n        \u003cinput\n          type=\"checkbox\"\n          checked={analyze}\n          onChange={(e) => setAnalyze(e.target.checked)}\n        />\n        Also analyze these games for training\n      \u003c/label>","note":"Same checkbox and action presentation as A. Provider date fields normally appear between this option and the action."},{"key":"C","label":"Either form · analysis selected","source":"frontend/src/Import.tsx:190","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import PGN\u003c/h3>\u003clabel class=\"import-analysis-option\">\u003cinput type=\"checkbox\" checked>Also analyze these games for training\u003c/label>\u003cbutton class=\"primary\">Import &amp; analyze games\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/button>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"          \u003clabel className=\"import-analysis-option\">\n            \u003cinput type=\"checkbox\" checked={analyze} onChange={event => setAnalyze(event.target.checked)} />\n            Also analyze these games for training\n          \u003c/label>\n          \u003cbutton className=\"primary\" disabled={busy || (pgnMode === \"file\" ? !file : !text.trim())}>\n            {busy ? \"Importing…\" : analyze ? \"Import & analyze games\" : \"Import games\"}\u003cArrowRight size={17} />\n          \u003c/button>","note":"The provider form uses the identical selected wording at ProviderImport.tsx:195."},{"key":"D","label":"PGN · busy action","source":"frontend/src/Import.tsx:194","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import PGN\u003c/h3>\u003clabel class=\"import-analysis-option\">\u003cinput type=\"checkbox\" checked>Also analyze these games for training\u003c/label>\u003cbutton class=\"primary\" disabled>Importing…\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/button>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"          \u003cbutton className=\"primary\" disabled={busy || (pgnMode === \"file\" ? !file : !text.trim())}>\n            {busy ? \"Importing…\" : analyze ? \"Import & analyze games\" : \"Import games\"}\u003cArrowRight size={17} />\n          \u003c/button>","note":"Current busy state disables the submit button; the analysis checkbox itself has no disabled prop."},{"key":"E","label":"Provider · busy action","source":"frontend/src/ProviderImport.tsx:194","context":"application","html":"\u003cdiv class=\"import-form\">\u003cform class=\"panel form-panel\">\u003ch3>Import from Chess.com\u003c/h3>\u003clabel class=\"import-analysis-option\">\u003cinput type=\"checkbox\" checked>Also analyze these games for training\u003c/label>\u003cbutton class=\"primary\" disabled>Queuing import…\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/button>\u003c/form>\u003c/div>","wrapper":"workspace-page","code":"      \u003cbutton className=\"primary\" disabled={busy || loadingUsername || !username.trim()}>\n        {busy ? \"Queuing import…\" : analyze ? \"Import & analyze games\" : \"Import games\"}\n        \u003cArrowRight size={17} />\n      \u003c/button>","note":"This wording distinguishes queuing a background provider import from uploading PGN."},{"key":"F","label":"Onboarding · stale instruction","source":"frontend/src/Onboarding.tsx:68","context":"application","html":"\u003col>\u003cli>In \u003cstrong>Settings → Games &amp; imports\u003c/strong>, choose \u003cstrong>Import older games\u003c/strong> for your site. Your username is already filled in.\u003c/li>\u003cli>Choose a time control and date range, then select \u003cstrong>Fetch games\u003c/strong>.\u003c/li>\u003cli>Open a game from \u003cstrong>Games\u003c/strong> to start its review. Use \u003cstrong>Update games\u003c/strong> there for your latest games.\u003c/li>\u003c/ol>","wrapper":"","code":"          \u003col>\n            \u003cli>In \u003cstrong>Settings → Games & imports\u003c/strong>, choose \u003cstrong>Import older games\u003c/strong> for your site. Your username is already filled in.\u003c/li>\n            \u003cli>Choose a time control and date range, then select \u003cstrong>Fetch games\u003c/strong>.\u003c/li>\n            \u003cli>Open a game from \u003cstrong>Games\u003c/strong> to start its review. Use \u003cstrong>Update games\u003c/strong> there for your latest games.\u003c/li>\n          \u003c/ol>","note":"The current instruction says Fetch games, while both current forms say Import games."}],"options":[{"value":"promote-A","label":"Promote A/B’s existing option/action; remove duplicate JSX and fix onboarding wording"},{"value":"shared-variants","label":"Share the identical option/action with separate PGN and provider busy copy"},{"value":"keep","label":"Keep the current implementations separate"},{"value":"defer","label":"Decide later"}],"recommendation":"Promote the already identical option/action markup, preserve Importing… versus Queuing import…, and align onboarding with Import games."},{"id":16,"title":"Evidence modal and promotion choice lifecycle","kind":"Behavior","difference":"Evidence opens a native dialog with showModal(), handles native cancel, and restores focus to its opener. Promotion is an absolutely positioned div declaring aria-modal without corresponding initial-focus, focus-trap, Escape or restore-focus code. Their content and board interaction have different purposes.","examples":[{"key":"A","label":"Evidence · native dialog, open appearance","source":"frontend/src/EvidenceDialog.tsx:17","context":"application","html":"\u003cdialog open aria-label=\"Decision evidence\" class=\"evidence-dialog panel\">\u003cdiv class=\"row-between\">\u003cdiv>\u003cdiv class=\"eyebrow\">VERIFIED GAME EVIDENCE\u003c/div>\u003ch2>Decision evidence\u003c/h2>\u003c/div>\u003cbutton class=\"icon-button\" aria-label=\"Close evidence\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\" aria-hidden=\"true\">\u003cpath d=\"M18 6 6 18\">\u003c/path>\u003cpath d=\"m6 6 12 12\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003cp>Loading evidence…\u003c/p>\u003c/dialog>","wrapper":"","code":"  useEffect(() => {\n    const opener = document.activeElement as HTMLElement | null;\n    const element = dialog.current;\n    element?.showModal();\n    return () => {\n      element?.close();\n      opener?.focus({ preventScroll: true });\n    };\n  }, []);\n  useEffect(() => {\n    read(\n      api.GET(\"/api/evidence/{decision_id}\", {\n        params: { path: { decision_id: id } },\n      }),\n    )\n      .then(setData)\n      .catch(fail);\n  }, [id, fail]);\n  return (\n    \u003cdialog\n      ref={dialog}\n      onCancel={onClose}\n      aria-label=\"Decision evidence\"\n      className=\"evidence-dialog panel\"\n    >\n      \u003cdiv className=\"row-between\">\n        \u003cdiv>\n          \u003cdiv className=\"eyebrow\">VERIFIED GAME EVIDENCE\u003c/div>\n          \u003ch2>Decision evidence\u003c/h2>\n        \u003c/div>\n        \u003cbutton\n          className=\"icon-button\"\n          onClick={onClose}\n          aria-label=\"Close evidence\"\n        >\n          \u003cX />\n        \u003c/button>\n      \u003c/div>\n      {data ? (\n        \u003cdiv className=\"evidence-grid\">\n          \u003cBoard\n            fen={data.fen}\n            orientation={data.fen.split(\" \")[1] === \"w\" ? \"white\" : \"black\"}\n            disabled\n          />","note":"Static open appearance only: an open attribute does not reproduce showModal() top-layer, backdrop, focus containment or Escape behavior. The source excerpt documents the real lifecycle. When loaded, Evidence renders \u003cBoard disabled> (lines 57–61)."},{"key":"B","label":"Evidence · closed native markup","source":"frontend/src/EvidenceDialog.tsx:36","context":"application","html":"\u003cdialog aria-label=\"Decision evidence\" class=\"evidence-dialog panel\">\u003cdiv class=\"row-between\">\u003cdiv>\u003cdiv class=\"eyebrow\">VERIFIED GAME EVIDENCE\u003c/div>\ ss=\"secondary history-toggle\" aria-expanded=\"false\">Show older activity (5)\u003c/button>\u003c/div>","wrapper":"workspace-page","code":"      {hiddenHistoryCount > 0 && \u003cbutton className=\"secondary history-toggle\" aria-expanded={showHistory} onClick={() => setShowHistory(!showHistory)}>\n        {showHistory ? \"Show recent activity\" : `Show older activity (${hiddenHistoryCount})`}\n      \u003c/button>}","note":"This is not details/summary. The real click toggles saved history visibility and changes wording to Show recent activity. Width styling currently comes from game-history.css."}],"options":[{"value":"promote-A","label":"Promote A’s plain summary treatment; retain rich history and review content variants"},{"value":"promote-B","label":"Promote B’s 44px summary treatment; retain rich history and review content variants"},{"value":"shared-variants","label":"Share summary tokens first; retain native details and rich-history variants"},{"value":"keep","label":"Keep the current implementations separate"},{"value":"defer","label":"Decide later"}],"recommendation":"Standardize summary target, spacing and style ownership first. Preserve native details behavior, the rich job summary, cold-practice restrictions and the separate older-history command."},{"id":18,"title":"Section headings and rows with actions","kind":"Structure","difference":"These layouts all place descriptive content beside an action, but serve different roles. Settings uses a 16px heading gap and fixed-width training buttons; Openings uses 20px gaps and bordered rows. PGN wraps on phones, while training, weaknesses, and opening rows stack. Settings headings themselves do not have the same mobile stacking rule.","examples":[{"key":"A","label":"Settings section heading","source":"frontend/src/SettingsSection.tsx:14","wrapper":"workspace-page","html":"\u003csection id=\"coach-settings\" class=\"panel settings-section coach-settings\" aria-labelledby=\"coach-settings-title\">\u003cdiv class=\"settings-section-heading\">\u003cdiv>\u003ch2 id=\"coach-settings-title\">Your coach\u003c/h2>\u003cp>Milo joins you in game review and practice.\u003c/p>\u003c/div>\u003cdiv class=\"coach-preference-status\" role=\"status\" aria-atomic=\"true\">Saved\u003c/div>\u003c/div>\u003c/section>","note":"Rendered from SettingsSection. This is its CoachSettings heading consumer (CoachSettings.tsx:19); the coach gallery below the heading is omitted."},{"key":"B","label":"Opening studies heading","source":"frontend/src/study/OpeningStudies.tsx:42","wrapper":"workspace-page","html":"\u003csection class=\"panel opening-studies\">\u003cdiv class=\"opening-management-heading\">\u003cdiv>\u003ch2>Your selected lines\u003c/h2>\u003cp class=\"small muted\">Rehearse one line here. Due accepts the combined moves from your active studies.\u003c/p>\u003c/div>\u003ca class=\"button-link secondary\" href=\"/study/openings/catalogue\">Browse catalogue\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>","note":"Current heading excerpt. The destination remains a link; its parent owns the section content."},{"key":"C","label":"PGN launcher row","source":"frontend/src/Import.tsx:163","wrapper":"workspace-page","html":"\u003csection class=\"panel settings-section\">\u003cdiv class=\"pgn-import-launcher\">\u003cdiv>\u003ch3>Have a PGN file?\u003c/h3>\u003cp class=\"small\">Import a game or a collection from any chess site.\u003c/p>\u003c/div>\u003cbutton class=\"secondary\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-file-up\" aria-hidden=\"true\">\u003cpath d=\"M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z\">\u003c/path>\u003cpath d=\"M14 2v5a1 1 0 0 0 1 1h5\">\u003c/path>\u003cpath d=\"M12 12v6\">\u003c/path>\u003cpath d=\"m15 15-3-3-3 3\">\u003c/path>\u003c/svg>Import PGN\u003c/button>\u003c/div>\u003c/section>","note":"Current row excerpt inside its panel; provider cards above it are omitted. Its top rule and padding are part of the current row."},{"key":"D","label":"Weakness evidence and practice row","source":"frontend/src/Weaknesses.tsx:70","wrapper":"workspace-page","html":"\u003cdiv class=\"panel weakness-list\">\u003cdiv class=\"weakness\">\u003cdiv>\u003cspan class=\"eyebrow\">ACROSS SEVERAL GAMES\u003c/span>\u003ch3>Loose pieces\u003c/h3>\u003cp>6 positions / 4 games / 3 scheduled reviews\u003c/p>\u003cp class=\"practice-cue\">Check which pieces are undefended before choosing a move.\u003c/p>\u003cp class=\"small\">Recent focused practice: 3 clean solves from 4 attempts.\u003c/p>\u003cdetails>\u003csummary>Browse supporting positions (2)\u003c/summary>\u003cdiv class=\"evidence-links\">\u003cbutton>Example 1\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003cbutton>Example 2\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\">\u003cpath d=\"m9 18 6-6-6-6\">\u003c/path>\u003c/svg>\u003c/button>\u003c/div>\u003c/details>\u003c/div>\u003cbutton class=\"secondary\">Practice 6 positions\u003c/button>\u003c/div>\u003c/div>","note":"Sample evidence values. The expandable evidence and practice action belong to Weaknesses, even if the surrounding layout becomes shared."},{"key":"E","label":"Training tools action rows","source":"frontend/src/Settings.tsx:58","wrapper":"workspace-page","html":"\u003csection class=\"panel settings-section\">\u003cdiv class=\"settings-section-heading\">\u003cdiv>\u003ch2>Training tools\u003c/h2>\u003c/div>\u003c/div>\u003cdiv class=\"settings-tool\">\u003cdiv>\u003ch3>Refresh training patterns\u003c/h3>\u003cp>Update the labels on saved positions using their existing analysis.\u003c/p>\u003c/div>\u003cbutton class=\"secondary\">Classify saved games\u003c/button>\u003c/div>\u003cdiv class=\"settings-tool\">\u003cdiv>\u003ch3>Investigate unclear positions\u003c/h3>\u003cp>Run additional engine analysis where the training explanation needs more evidence.\u003c/p>\u003c/div>\u003cbutton class=\"secondary\">Deepen unclear positions\u003c/button>\u003c/div>\u003c/section>","note":"Both current training rows. Buttons have a 220px desktop basis, unlike the content-sized actions in the other examples."},{"key":"F","label":"Opening study row","source":"frontend/src/study/OpeningStudies.tsx:47","wrapper":"workspace-page","html":"\u003csection class=\"panel opening-studies\">\u003cdiv class=\"opening-study-list\">\u003carticle class=\"opening-study\" aria-label=\"Italian Game as white\">\u003cdiv>\u003cspan class=\"opening-study-status\">Active · White · C50\u003c/span>\u003ch3>Italian Game\u003c/h3>\u003cp class=\"small muted\">8 recall positions · 3 due\u003c/p>\u003c/div>\u003cdiv class=\"button-row\">\u003cbutton>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-play\" aria-hidden=\"true\">\u003cpath d=\"M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z\">\u003c/path>\u003c/svg>Practice line\u003c/button>\u003cbutton class=\"secondary\">Pause recalls\u003c/button>\u003c/div>\u003c/article>\u003c/div>\u003c/section>","note":"Current bordered study row with two commands, not a generic single-action card."}],"options":[{"value":"preserve-variants","label":"Share heading/row layout while preserving all current domain variants"},{"value":"settings-family","label":"Prefer A for headings and E for simple action rows; retain richer D/F content"},{"value":"openings-family","label":"Prefer B for headings and F for action rows; retain their domain-specific contents"},{"value":"keep-separate","label":"Keep these layouts separate; do not extract a shared component"}],"recommendation":"Share only the side-by-side/phone layout if it stays small. Preserve headings versus rows, single versus multiple actions, and the content owned by each screen."},{"id":19,"title":"Resume and course-line links","kind":"Structure","difference":"Puzzle and lesson resume links already use the same .study-resume appearance and the same 18px arrow. Course repertoire links use that style too, with a 17px arrow and section-specific spacing. The opportunity is one markup owner, not a visible redesign.","examples":[{"key":"A","label":"Puzzle resume","source":"frontend/src/study/StudyScreen.tsx:99","wrapper":"workspace-page","html":"\u003csection class=\"panel\">\u003ch2>Continue practicing\u003c/h2>\u003cdiv class=\"study-resume-list\">\u003ca class=\"study-resume\" href=\"/study/puzzles/sessions/example\">\u003cspan>Unfinished puzzle \u003csmall>Your position is saved\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/a>\u003ca class=\"study-resume\" href=\"/study/puzzles/sessions/retry\">\u003cspan>Unfinished puzzle \u003csmall>Continue after a retry\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>","note":"Both current subtitle states are shown with sample session destinations."},{"key":"B","label":"Lesson resume","source":"frontend/src/study/LessonLibrary.tsx:67","wrapper":"workspace-page","html":"\u003csection class=\"panel\">\u003ch2>Continue learning\u003c/h2>\u003cdiv class=\"study-resume-list\">\u003ca class=\"study-resume\" href=\"/study/openings/sessions/example\">\u003cspan>Italian Game\u003csmall>Developing your pieces\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/a>\u003c/div>\u003c/section>","note":"Same row style as A; only the current content differs."},{"key":"C","label":"Course repertoire preview link","source":"frontend/src/study/LessonLibrary.tsx:61","wrapper":"workspace-page","html":"\u003csection class=\"panel lesson-course\">\u003csection class=\"lesson-repertoire-lines\" aria-label=\"Course recall lines\">\u003ch3>Keep these lines in memory\u003c/h3>\u003cp class=\"small muted\">Adding a line is optional. Lesson completion does not enroll it automatically.\u003c/p>\u003ca class=\"study-resume\" href=\"/study/openings/courses/example/lines/main?revision=1\">\u003cspan>Main line\u003csmall>Preview and add to study\u003c/small>\u003c/span>\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-arrow-right\" aria-hidden=\"true\">\u003cpath d=\"M5 12h14\">\u003c/path>\u003cpath d=\"m12 5 7 7-7 7\">\u003c/path>\u003c/svg>\u003c/a>\u003c/section>\u003c/section>","note":"The same row is also used for a preview destination, not only an unfinished session. Preserve that distinction in its name and API."}],"options":[{"value":"shared-row","label":"Promote the existing row style; share markup for A, B, and C with supplied destinations"},{"value":"resume-only","label":"Share A/B resume markup; keep the course preview composition separate"},{"value":"css-only","label":"Keep the current shared CSS and delete this optional extraction proposal"}],"recommendation":"Keep the current appearance. A tiny title/subtitle/arrow link can cover all three without owning session or catalogue behavior."},{"id":20,"title":"Puzzle and opening statistics","kind":"Structure","difference":"Both displays already use the identical .study-stats definition-list markup and CSS: muted 12px labels, 20px monospace values, and the same wrapping. There is no current visual mismatch.","examples":[{"key":"A","label":"Puzzle practice statistics","source":"frontend/src/study/StudyScreen.tsx:107","wrapper":"workspace-page","html":"\u003csection class=\"panel\">\u003ch2>Your puzzle practice\u003c/h2>\u003cdl class=\"study-stats\">\u003cdiv>\u003cdt>Solved cleanly\u003c/dt>\u003cdd>24\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Failed, then solved\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Revealed\u003c/dt>\u003cdd>3\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>","note":"Sample counts; this panel is shown only when at least one practice count is nonzero."},{"key":"B","label":"Opening study statistics","source":"frontend/src/study/OpeningStudies.tsx:46","wrapper":"workspace-page","html":"\u003csection class=\"panel opening-studies\">\u003cdl class=\"study-stats\">\u003cdiv>\u003cdt>Active studies\u003c/dt>\u003cdd>4\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Learning positions\u003c/dt>\u003cdd>24\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Due now\u003c/dt>\u003cdd>8\u003c/dd>\u003c/div>\u003c/dl>\u003c/section>","note":"Excerpt of the same metric layout within My studies. The heading above it is shown separately in UI-18."}],"options":[{"value":"stat-list","label":"Promote the shared A/B markup into a small StatList; keep the appearance"},{"value":"css-only","label":"Keep shared CSS and delete this optional extraction proposal"}],"recommendation":"Optional maintenance only. Keep these visuals and native definition-list semantics whichever implementation you choose."},{"id":21,"title":"Status above the board","kind":"Structure","difference":"All four modes already share .review-position-status. Review, lesson, and puzzle also repeat the same turn-dot markup; opening preview intentionally has no turn dot. Their messages and right-hand counters express different session states.","examples":[{"key":"A","label":"Scheduled recall","source":"frontend/src/Review.tsx:86","wrapper":"review-page","html":"\u003cdiv class=\"review-position-status\">\u003cspan>\u003cspan class=\"turn-dot \">\u003c/span>White to move\u003c/span>\u003cspan>8 IN QUEUE\u003c/span>\u003c/div>","note":"Current cold-practice status. It does not expose source, score, or the answer."},{"key":"B","label":"Lesson","source":"frontend/src/study/LessonPlayer.tsx:43","wrapper":"review-page","html":"\u003cdiv class=\"review-position-status\">\u003cspan>\u003cspan class=\"turn-dot black\">\u003c/span>Black to move\u003c/span>\u003cspan>Developing your pieces\u003c/span>\u003c/div>","note":"A normal lesson move. During a branch or game playback, the same row can show ALTERNATIVE LINE or the current ply."},{"key":"C","label":"Puzzle","source":"frontend/src/study/PuzzlePlayer.tsx:69","wrapper":"review-page","html":"\u003cdiv class=\"review-position-status\">\u003cspan>\u003cspan class=\"turn-dot \">\u003c/span>White to move\u003c/span>\u003cspan>2 MOVES PLAYED\u003c/span>\u003c/div>","note":"Puzzle status changes to Solution review after completion; the current dot is based on the session orientation."},{"key":"D","label":"Opening line preview","source":"frontend/src/study/OpeningLinePreview.tsx:81","wrapper":"review-page","html":"\u003cdiv class=\"review-position-status\">\u003cspan>Line preview\u003c/span>\u003cspan>4 / 12 PLIES\u003c/span>\u003c/div>","note":"Same visual layout without a turn indicator. This is an inspection session, not a prompt to answer a move."}],"options":[{"value":"board-status","label":"Share the existing A–D status row with an optional turn indicator and supplied messages"},{"value":"turn-only","label":"Share only the A/B/C turn indicator; retain each status composition"},{"value":"css-only","label":"Keep shared CSS and delete this optional extraction proposal"}],"recommendation":"Preserve the common appearance. A small status row can own layout, while each mode continues to decide which information is visible."},{"id":22,"title":"Accuracy and player identity","kind":"Behavior","difference":"History renders its own two-player accuracy grid and names/ratings/colors. Board rows and the review summary already share AccuracyReadout. All round to one decimal, but pending history shows a review action while AccuracyReadout shows a dash with an explanatory accessible description. Completed-but-unavailable wording also differs.","examples":[{"key":"A","label":"Game history: complete, unavailable, and reviewing","source":"frontend/src/GameHistory.tsx:109","wrapper":"workspace-page","html":"\u003csection class=\"game-library\" aria-label=\"Game history\">\u003cdiv class=\"game-library-heading\" aria-hidden=\"true\">\u003cspan class=\"history-time\">Time\u003c/span>\u003cspan class=\"history-players\">Players\u003c/span>\u003cspan class=\"history-result\">Result\u003c/span>\u003cspan class=\"history-accuracy\">Accuracy\u003c/span>\u003cspan class=\"history-moves\">Moves\u003c/span>\u003cspan class=\"history-date\">Date\u003c/span>\u003cspan>\u003c/span>\u003c/div>\u003cul class=\"game-library-list\">\u003cli>\u003ca class=\"game-library-item\" aria-label=\"Open review: Avery vs Morgan\" aria-describedby=\"history-complete-example\" href=\"/games/complete-example\">\u003cspan class=\"history-players\">\u003cspan class=\"history-player history-line is-learner\">\u003cspan class=\"history-color white\" title=\"White pieces\">\u003c/span>\u003cstrong title=\"Avery\">Avery\u003c/strong>\u003cspan class=\"history-rating\">(1520)\u003c/span>\u003c/span>\u003cspan class=\"history-player history-line \">\u003cspan class=\"history-color black\" title=\"Black pieces\">\u003c/span>\u003cstrong title=\"Morgan\">Morgan\u003c/strong>\u003cspan class=\"history-rating\">(1498)\u003c/span>\u003c/span>\u003c/span>\u003cspan class=\"history-result\" title=\"You won\">\u003cspan class=\"history-scores\">\u003cspan class=\"history-line\">1\u003c/span>\u003cspan class=\"history-line\">0\u003c/span>\u003c/span>\u003cspan class=\"history-outcome outcome-win\">Won\u003c/span>\u003c/span>\u003cspan class=\"history-accuracy\" title=\"Original-game accuracy, White then Black\">\u003cspan class=\"history-line\" data-color=\"white\">91.2\u003c/span>\u003cspan class=\"history-line\" data-color=\"black\">76.4\u003c/span>\u003c/span>\u003cspan class=\"history-meta\">\u003cspan class=\"history-time\" title=\"10 + 5\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-clock3 lucide-clock-3\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\">\u003c/circle>\u003 le=\"Morgan\">Morgan\u003c/strong>\u003coutput class=\"game-accuracy\" aria-label=\"Black accuracy\" title=\"Accuracy will appear when the full game review finishes.\">\u003cspan>Accuracy\u003c/span>\u003cb>—\u003c/b>\u003cspan class=\"sr-only\">Accuracy will appear when the full game review finishes.\u003c/span>\u003c/output>\u003c/div>\u003cspan class=\"game-player-status\" title=\"In progress\">In progress\u003c/span>\u003c/div>","note":"Two illustrative states rendered from the real component. Both show a dash, but their titles and screen-reader text distinguish unavailable analysis from analysis still in progress."}],"options":[{"value":"shared-value","label":"Share accuracy formatting/availability; preserve the history grid and board/summary layouts"},{"value":"readout-variants","label":"Extend AccuracyReadout with a history presentation; keep A’s review-action state"},{"value":"keep-separate","label":"Keep these implementations separate and remove the proposed accuracy extraction"}],"recommendation":"Use the existing AccuracyReadout contract for values and availability, with an explicit history presentation if needed. Keep history’s compact player grid and row-level description."},{"id":23,"title":"Lesson, puzzle, and opening sources","kind":"Appearance","difference":"Lessons have a Sources heading and 11px citation text, puzzles have 12px provenance paragraphs and a Source link, and openings have a 10px footer with a revision. Lesson and puzzle links already allow only HTTP(S) URLs. Opening provenance is currently plain text rather than an external link.","examples":[{"key":"A","label":"Lesson sources with optional license and URL","source":"frontend/src/study/LessonAttribution.tsx:5","wrapper":"workspace-page","html":"\u003cdiv class=\"lesson-attributions\">\u003ch3>Sources\u003c/h3>\u003cp>Example opening course — authored lesson notes\u003cspan class=\"muted\"> · CC BY-SA 4.0\u003c/span> · \u003ca href=\"https://example.com/course-source\" target=\"_blank\" rel=\"noreferrer\">View source\u003c/a>\u003c/p>\u003cp>Illustrative game: Avery–Morgan, 2026\u003c/p>\u003c/div>","note":"Rendered from LessonAttribution in its course-library context (LessonLibrary.tsx:62). The same component is also used during lesson game playback. Illustrative citations show optional license/link behavior; these are sample sources, not claims about installed course content."},{"key":"B","label":"Puzzle collection attribution","source":"frontend/src/study/PuzzlePlayer.tsx:86","wrapper":"review-page","html":"\u003cp class=\"puzzle-provenance\">Puzzle practice · Collection puzzle\u003c/p>\u003cp class=\"puzzle-provenance\">Example puzzle collection · CC0 · \u003ca href=\"https://example.com/puzzle-source\" target=\"_blank\" rel=\"noreferrer\">Source\u003c/a>\u003c/p>","note":"Current footer excerpt with sample attribution text. Shown only in the completed puzzle’s solution panel."},{"key":"C","label":"Puzzle from your games, without an external URL","source":"frontend/src/study/PuzzlePlayer.tsx:86","wrapper":"review-page","html":"\u003cp class=\"puzzle-provenance\">Puzzle practice · From your games\u003c/p>\u003cp class=\"puzzle-provenance\">Example saved game\u003c/p>","note":"Same puzzle markup, with the games label and no URL. Source records remain owned by the puzzle session."},{"key":"D","label":"Opening catalogue provenance","source":"frontend/src/study/OpeningLinePreview.tsx:98","wrapper":"review-page","html":"\u003cp class=\"opening-source\">Lichess opening catalogue · CC0 · Revision example-1\u003c/p>","note":"Current catalogue branch; sample revision. The footer is plain text."},{"key":"E","label":"Authored opening line provenance","source":"frontend/src/study/OpeningLinePreview.tsx:98","wrapper":"review-page","html":"\u003cp class=\"opening-source\">Authored course repertoire line · Revision example-1\u003c/p>","note":"Current authored-course branch. It intentionally identifies a different source record from the catalogue."}],"options":[{"value":"shared-format","label":"Share source/link formatting while keeping A’s heading and B–E provenance fields"},{"value":"lesson-size","label":"Use A’s 11px citation text across source footers; preserve optional license/revision content"},{"value":"puzzle-size","label":"Use B’s 12px citation text across source footers; preserve headings and source distinctions"},{"value":"keep-separate","label":"Keep source presentations separate and remove the proposed extraction"}],"recommendation":"Share safe link and source-line formatting where useful. Keep optional licenses, revision identifiers, multiple lesson citations, and the original provenance records."},{"id":24,"title":"Motion preference selector","kind":"Appearance","difference":"The same three native options are rendered twice. Settings uses a label beside a 44px selector (stacked on phones); Studio uses a label above a 42px selector inside its controls tray. Changing the Studio field also clears simulated reduced motion.","examples":[{"key":"A","label":"Settings — existing MotionSelect","source":"frontend/src/MotionSelect.tsx:12","context":"application","wrapper":"workspace-page","html":"\u003cdiv class=\"motion-setting\">\u003clabel for=\"coach-motion\">Coach motion\u003c/label>\u003cselect id=\"coach-motion\">\u003coption value=\"system\">Use device setting\u003c/option>\u003coption value=\"natural\">Animated\u003c/option>\u003coption value=\"still\">Still\u003c/option>\u003c/select>\u003c/div>","code":"    \u003clabel htmlFor={id}>{label}\u003c/label>\n    \u003cselect id={id} aria-describedby={describedBy} disabled={disabled}\n      value={value} onChange={event => onChange(event.target.value as MotionPreference)}>\n      \u003coption value=\"system\">Use device setting\u003c/option>\n      \u003coption value=\"natural\">Animated\u003c/option>\n      \u003coption value=\"still\">Still\u003c/option>\n    \u003c/select>\n  \u003c/div>;\n}","note":"Current Settings label from MotionSettings.tsx:13. Application layout is owned by motion.css; it must be separated before the standalone Studio can reuse this control."},{"key":"B","label":"Studio — local motion selector","source":"frontend/src/coach/studio/CoachStudio.tsx:213","context":"studio","wrapper":"studio-page","html":"\u003csection class=\"studio-controls\" aria-label=\"Animation preview controls\">\u003clabel>Motion intensity\u003cselect>\u003coption value=\"system\">Use device setting\u003c/option>\u003coption value=\"natural\">Animated\u003c/option>\u003coption value=\"still\">Still\u003c/option>\u003c/select>\u003c/label>\u003c/section>","code":"        \u003clabel>\n          Motion intensity\n          \u003cselect\n            value={motion}\n            onChange={(event) => {\n              setMotion(event.target.value as CoachMotion);\n              setReduced(false);\n            }}\n          >\n            \u003coption value=\"system\">Use device setting\u003c/option>\n            \u003coption value=\"natural\">Animated\u003c/option>\n            \u003coption value=\"still\">Still\u003c/option>\n          \u003c/select>\n        \u003c/label>","note":"The source callback calls both setMotion(...) and setReduced(false). Previewing these native options does not run the Studio simulation."}],"options":[{"value":"A","label":"Use A’s shared field, keeping Studio’s callback"},{"value":"B","label":"Use B’s label-above layout with shared options"},{"value":"shared-compact","label":"Share options and behavior; retain both layouts"},{"value":"keep","label":"Keep the current implementations"}],"recommendation":"Reuse MotionSelect after separating its control styling from application layout. Preserve the Studio callback and decide whether its compact layout is an intentional variant."},{"id":25,"title":"Negative evaluation in Studio previews","kind":"Appearance","difference":"Studio renders a score string with the base class only. The production component adds the winning-side attribute, so the same negative evaluation has a dark badge, plus a White-perspective accessible label and tooltip.","examples":[{"key":"A","label":"Studio — raw score string","source":"frontend/src/coach/studio/PreviewPanels.tsx:117","context":"studio","wrapper":"studio-page","html":"\u003cspan class=\"evaluation-score\">−2.20\u003c/span>","code":"            \u003cReviewCoach\n              title={\u003cstrong>{example.title}\u003c/strong>}\n              evaluation={\n                \u003cspan className=\"evaluation-score\">{example.evaluation}\u003c/span>\n              }\n              character={\u003cCoachCharacter {...preview} />}\n              actions={\u003cbutton disabled>Show why\u003c/button>}","note":"Existing “mistake” example value from coach/studio/examples.ts. No data-side, perspective label or score tooltip is supplied."},{"key":"B","label":"Application — EvaluationScore","source":"frontend/src/EvaluationScore.tsx:3","context":"application","wrapper":"review-page","html":"\u003cspan class=\"evaluation-score\" data-side=\"black\" aria-label=\"Position evaluation for White: −2.20\" title=\"Black is better. Scores are from White's perspective.\">−2.20\u003c/span>","code":"export default function EvaluationScore({ score }: { score: Score | null | undefined }) {\n  return \u003cspan className=\"evaluation-score\" data-side={scoreSide(score)}\n    aria-label={`Position evaluation for White: ${scoreText(score)}`}\n    title={`${scoreSummary(score)}. Scores are from White's perspective.`}>{scoreText(score)}\u003c/span>;\n}","note":"Existing component output for the equivalent typed score {kind: \"cp\", value: -220}. Both samples use the current shared coach-presentation.css."}],"options":[{"value":"B","label":"Use B — real EvaluationScore in Studio"},{"value":"keep","label":"Keep the current implementations"}],"recommendation":"Use EvaluationScore and typed illustrative scores in Studio. Keep the current production rendering and its accessible White-perspective description."},{"id":26,"t n yet.\u003c/p>","code":"export default function DialogueText({utterance, className}: {utterance: CoachUtterance; className?: string}) {\n  return \u003cp className={className} aria-live=\"polite\" data-utterance={utterance.id} data-intent={utterance.intentId} data-dialogue-coach={utterance.coachId}>\n    {utterance.text}\n  \u003c/p>;\n}","note":"The same existing fallback sentence from dialogue/neutral.ts:64 is used in all samples; metadata IDs here are illustrative. The source shows the real runtime values. The current component announces updates politely."},{"key":"B","label":"Lab — inspected utterance","source":"frontend/intelligence-lab/IntelligenceLab.tsx:57","context":"lab","wrapper":"intelligence-lab","html":"\u003cp class=\"lab-utterance\">I don't have a clear explanation for this position yet.\u003c/p>","code":"        \u003csection aria-label=\"Rendered coach line\">\u003ch2>{coachId === \"neutral\" ? \"Neutral coach\" : getCoach(coachId).name}\u003c/h2>\u003cp className=\"lab-utterance\">{utterance!.text}\u003c/p>\n          \u003cp>{inspection.intent.purpose} · {inspection.intent.expression} · priority {inspection.intent.priority}\u003c/p>\n          \u003ccode>{utterance!.id}\u003c/code>\u003cp>Deterministic seed: \u003ccode>{inspection.intent.id}\u003c/code>\u003c/p>","note":"Current lab text styling is 1.2rem with a 1.6 line height. Intent and utterance ID are printed separately; this paragraph is not a live region."},{"key":"C","label":"Lab — comparison text and list values","source":"frontend/intelligence-lab/CoachComparison.tsx:20","context":"lab","wrapper":"intelligence-lab","html":"\u003cp class=\"lab-voice-line\">I don't have a clear explanation for this position yet.\u003c/p>","code":"        {samples ? \u003cdl className=\"lab-voice-samples\">{samples.map(sample => \u003cdiv key={sample.label}>\n          \u003cdt>{sample.label}\u003c/dt>\u003cdd className=\"lab-voice-line\">{renderDialogue(sample.intent, coach).text}\u003c/dd>\n        \u003c/div>)}\u003c/dl> : \u003cp className=\"lab-voice-line\">{utterance.text}\u003c/p>}","note":"The visible sample is the existing single-line paragraph branch. Comparing multiple situations uses \u003cdt> labels and \u003cdd class=\"lab-voice-line\"> values; both branches must remain non-live."}],"options":[{"value":"shared-nonlive","label":"Share text/metadata with explicit non-live lab rendering"},{"value":"keep","label":"Keep the current implementations"},{"value":"defer","label":"Defer this optional extraction"}],"recommendation":"Optionally share text/metadata rendering underneath the current containers. Keep production’s live paragraph, preserve lab \u003cdd> semantics and never announce all comparison cards. This is not a request to choose one text size everywhere."},{"id":29,"title":"Studio and lab checkbox rows","kind":"Appearance","difference":"The studio’s reduced-motion row and idle toggles have separate 16px checkbox rules and different row placement. Lab checkboxes are 18px, using lab-inline or lab-controls. All remain native labelled checkboxes; each caller owns its distinct effect.","examples":[{"key":"A","label":"Studio — reduced motion","source":"frontend/src/coach/studio/CoachStudio.tsx:244","context":"studio","wrapper":"studio-page","html":"\u003csection class=\"studio-controls\" aria-label=\"Animation preview controls\">\u003clabel class=\"studio-reduced\">\u003cinput type=\"checkbox\"> Reduced motion\u003c/label>\u003c/section>","code":"        \u003clabel className=\"studio-reduced\">\n          \u003cinput\n            type=\"checkbox\"\n            checked={reduced || deviceStill}\n            disabled={deviceStill}\n            onChange={(event) => setReduced(event.target.checked)}\n          />{\" \"}\n          Reduced motion\n        \u003c/label>","note":"16px checkbox. This row has its own tray alignment/margins; when the device requests reduced motion, the real control is checked and disabled."},{"key":"B","label":"Studio — idle playb (option.label) + '</span></label>').join('') + '</div></fieldset><label class="notes-label" for="decision-note">What to keep, remove, or combine</label><textarea id="decision-note" placeholder="Optional details for this comparison">' + esc(answer.note || '') + '</textarea><div class="saved" role="status">No decision is selected by default.</div><button class="clear-choice" id="clear-choice">Clear this decision</button><footer class="pager"><button id="previous"' + (current === 1 ? ' disabled' : '') + '>← Previous</button><span class="count">' + current + ' / 30</span><button id="next">' + (current === 30 ? 'Review all choices' : 'Next comparison →') + '</button></footer>';
