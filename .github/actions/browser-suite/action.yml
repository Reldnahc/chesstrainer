name: Run one browser suite job
description: >
  Shared steps of the application and studio browser jobs: runtimes, Chromium, the
  built frontend when the suite serves it, the Playwright run and failure diagnostics.
inputs:
  config:
    description: Playwright config file in frontend/
    required: true
  project:
    description: desktop or mobile
    required: true
  shard:
    description: TEST_SHARD value such as 1/4
    required: true
  api:
    description: The suite starts the application server, so it needs Stockfish
    required: true
  python:
    description: The suite runs Python (the app or semantic fixtures)
    required: true
  dist:
    description: The suite serves the built frontend from the frontend-build job
    required: true
  diagnostics:
    description: Artifact name for failure diagnostics
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      if: inputs.python == 'true'
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Install native engine for application integration
      if: inputs.api == 'true'
      uses: ./.github/actions/stockfish
    - name: Install Python runtime for the app or semantic fixtures
      if: inputs.python == 'true'
      uses: ./.github/actions/python-env
    - run: npm ci
      shell: bash
      working-directory: frontend
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      if: inputs.dist == 'true'
      with:
        name: frontend-dist
        path: frontend
    - name: Unpack the built frontend
      if: inputs.dist == 'true'
      shell: bash
      run: tar -xf frontend-dist.tar && rm frontend-dist.tar
      working-directory: frontend
    - name: Restore Chromium from cache
      id: chromium
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ms-playwright
        key: chromium-shell-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
    - name: Install Chromium
      if: steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium --only-shell
      working-directory: frontend
    - name: Run isolated browser project
      shell: bash
      env:
        TEST_CONFIG: ${{ inputs.config }}
        TEST_PROJECT: ${{ inputs.project }}
        TEST_SHARD: ${{ inputs.shard }}
        STOCKFISH_PATH: /usr/games/stockfish
      # Each config reads TEST_SHARD itself: the application suite balances whole
      # files by recorded duration, the fully parallel suites split tests evenly.
      run: npx playwright test --config "$TEST_CONFIG" --project "$TEST_PROJECT" --reporter=line
      working-directory: frontend
    - name: Preserve failure diagnostics
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.diagnostics }}
        path: |
          frontend/test-results
          frontend/account-test-results
          frontend/studio-test-results
          frontend/intelligence-test-results
          frontend/audio-test-results
        if-no-files-found: ignore
        retention-days: 7
