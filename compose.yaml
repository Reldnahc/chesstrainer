services:
  fieldwork:
    image: ghcr.io/reldnahc/chesstrainer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-18000}:8000"
    volumes:
      - "${APPDATA_PATH:-fieldwork-data}:/data"
    environment:
      # false: one local workspace without login. true: club accounts with sign-in.
      ACCOUNTS_ENABLED: "${ACCOUNTS_ENABLED:-false}"
      # Accounts only. false: administrators add members. true: anyone can sign up.
      SIGNUPS_OPEN: "${SIGNUPS_OPEN:-false}"
      # Optional. Blank accepts the address the browser used.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      SESSION_SECURE: "${SESSION_SECURE:-true}"
      # Reverse proxy address whose X-Forwarded-For is trusted for sign-in rate limits.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      DATABASE_PATH: /data/trainer.sqlite3
      STOCKFISH_PATH: /usr/games/stockfish
      ENGINE_SLOTS: "${ENGINE_SLOTS:-4}"
      STOCKFISH_THREADS: "${STOCKFISH_THREADS:-1}"
      STOCKFISH_HASH_MB: "${STOCKFISH_HASH_MB:-64}"
      STOCKFISH_WORKERS: "${STOCKFISH_WORKERS:-1}"
      # cpu needs nothing extra. cuda downloads CUDA PyTorch (about 3 GB) into
      # /data once on first start and needs the GPU reservation below.
      HUMAN_MODEL_DEVICE: "${HUMAN_MODEL_DEVICE:-cpu}"
      CHESSCOM_USER_AGENT: "${CHESSCOM_USER_AGENT:-FieldworkChessTrainer/0.1}"
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Optional NVIDIA GPU for Maia (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
volumes:
  fieldwork-data:
