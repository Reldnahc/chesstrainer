name: correctness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites regardless of changed files
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      skip_docker_install:
        description: The caller builds and smoke-tests the image before publishing it
        type: boolean
        default: false

permissions:
  contents: read

# This prefix differs from the release caller's group to avoid self-cancellation.
concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      build: ${{ steps.plan.outputs.build }}
      docker: ${{ steps.plan.outputs.docker }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select checks from the complete changed-path set
        id: plan
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          CI_FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ "$CI_FULL" = "true" ]; then args+=(--full); fi
          python scripts/ci_plan.py --base "$CI_BASE" --head HEAD "${args[@]}"

  frontend-build:
    name: Frontend build and types
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - name: Lint, format, contracts and migrations
        run: |
          ruff check backend scripts migrations
          ruff format --check backend scripts migrations
          python scripts/export_api_contract.py --check
          alembic upgrade head
          alembic check
      - run: python -m pytest -q --durations=20
        env:
          STOCKFISH_PATH: /usr/games/stockfish

  browser:
    name: Browser (${{ matrix.suite }}, ${{ matrix.project }}, ${{ matrix.shard }})
    needs: [changes, frontend-build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native engine for application integration
        if: matrix.api
        run: sudo apt-get update && sudo apt-get install -y stockfish
      - name: Install Python runtime for the app or semantic fixtures
        if: matrix.python
        run: python -m venv .venv && .venv/bin/pip install -r requirements.lock && .venv/bin/pip install --no-deps -e .
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - name: Run isolated browser project
        env:
          TEST_CONFIG: ${{ matrix.config }}
          TEST_PROJECT: ${{ matrix.project }}
          TEST_SHARD: ${{ matrix.shard }}
          STOCKFISH_PATH: /usr/games/stockfish
        run: npx playwright test --config "$TEST_CONFIG" --project "$TEST_PROJECT" --shard "$TEST_SHARD" --reporter=line
        working-directory: frontend
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: |
            frontend/test-results
            frontend/account-test-results
            frontend/studio-test-results
            frontend/intelligence-test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-install:
    name: Docker installation
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !inputs.skip_docker_install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - uses: docker/setup-buildx-action@v3
      - name: Build install-check image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fieldwork:install-check
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=max
      - run: python scripts/smoke_install.py --image fieldwork:install-check

  gate:
    name: CI
    if: always()
    needs: [changes, frontend-build, backend, browser, docker-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every selected check to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_SKIP_DOCKER: ${{ inputs.skip_docker_install }}
        run: python scripts/ci_plan.py --check-results
