name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites regardless of changes since the last successful release
        type: boolean
        default: true

permissions:
  contents: read

# A newer release must not race an older image's update of the latest tag.
concurrency:
  group: fieldwork-release
  cancel-in-progress: false

jobs:
  release-base:
    name: Find verified release baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.baseline.outputs.base }}
      full: ${{ steps.baseline.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Include changes from failed or superseded releases
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: python scripts/ci_release_base.py

  correctness:
    needs: release-base
    uses: ./.github/workflows/test.yml
    with:
      base: ${{ needs.release-base.outputs.base }}
      # Missing/malformed baseline outputs must never fall back to the last push.
      full: ${{ needs.release-base.outputs.full != 'false' || needs.release-base.outputs.base == '' }}
      skip_docker_install: true

  docker:
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the release image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/reldnahc/chesstrainer:latest
            ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Reldnahc/chesstrainer
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=max
      - name: Smoke-test the exact image to be published
        env:
          IMAGE: ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
        run: python scripts/smoke_install.py --image "$IMAGE"
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker push ghcr.io/reldnahc/chesstrainer:latest
