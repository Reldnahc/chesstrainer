name: correctness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites regardless of changed files
        type: boolean
        default: true
  workflow_call:
    inputs:
      base:
        description: Verified comparison commit supplied by the release caller
        type: string
        default: ''
      full:
        type: boolean
        default: true
      skip_docker_install:
        description: The caller builds and smoke-tests the image before publishing it
        type: boolean
        default: false

permissions:
  contents: read

# This prefix differs from the release caller's group to avoid self-cancellation.
concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      build: ${{ steps.plan.outputs.build }}
      docker: ${{ steps.plan.outputs.docker }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select checks from the complete changed-path set
        id: plan
        env:
          CI_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          CI_FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ "$CI_FULL" = "true" ]; then args+=(--full); fi
          python scripts/ci_plan.py --base "$CI_BASE" --head HEAD "${args[@]}"

  frontend-build:
    name: Frontend build and types
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs a balanced half of the test files over its 4 cores. The
        # voice-bank check (about 75 s) runs on the first shard, whose longest group is
        # one course file, and lint on the second, so the two finish closer together.
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Stockfish from the cached package
        uses: ./.github/actions/stockfish
      - name: Install the locked Python environment from cache
        uses: ./.github/actions/python-env
      - name: Lint and format
        if: matrix.shard == '2/2'
        run: |
          ruff check backend scripts migrations
          ruff format --check backend scripts migrations
      - name: Verify the complete recorded voice bank offline
        if: matrix.shard == '1/2'
        run: python -B -S scripts/prepare_coach_voice_bank.py --check
      - name: Run this shard's backend tests in parallel groups
        run: python scripts/pytest_parallel.py --shard "${{ matrix.shard }}" -n 4 -q --durations=10
        env:
          STOCKFISH_PATH: /usr/games/stockfish

  browser:
    name: Browser (${{ matrix.suite }}, ${{ matrix.project }}, ${{ matrix.shard }})
    needs: [changes, frontend-build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native engine for application integration
        if: matrix.api
        uses: ./.github/actions/stockfish
      - name: Install Python runtime for the app or semantic fixtures
        if: matrix.python
        uses: ./.github/actions/python-env
      - run: npm ci
        working-directory: frontend
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Restore Chromium from cache
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-shell-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - name: Run isolated browser project
        env:
          TEST_CONFIG: ${{ matrix.config }}
          TEST_PROJECT: ${{ matrix.project }}
          TEST_SHARD: ${{ matrix.shard }}
          STOCKFISH_PATH: /usr/games/stockfish
        # Each config reads TEST_SHARD itself: the application suite balances whole
        # files by recorded duration, the fully parallel suites split tests evenly.
        run: npx playwright test --config "$TEST_CONFIG" --project "$TEST_PROJECT" --reporter=line
        working-directory: frontend
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ strategy.job-index }}
          path: |
            frontend/test-results
            frontend/account-test-results
            frontend/studio-test-results
            frontend/intelligence-test-results
            frontend/audio-test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-install:
    name: Docker installation
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !inputs.skip_docker_install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build install-check image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fieldwork:install-check
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=max
      - run: python scripts/smoke_install.py --image fieldwork:install-check

  gate:
    name: CI
    if: always()
    needs: [changes, frontend-build, backend, browser, docker-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every selected check to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_SKIP_DOCKER: ${{ inputs.skip_docker_install }}
        run: python scripts/ci_plan.py --check-results
