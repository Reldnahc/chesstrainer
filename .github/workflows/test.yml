name: correctness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites regardless of changed files
        type: boolean
        default: true
  workflow_call:
    inputs:
      base:
        description: Verified comparison commit supplied by the release caller
        type: string
        default: ''
      full:
        type: boolean
        default: true
      skip_docker_install:
        description: The caller builds and smoke-tests the image before publishing it
        type: boolean
        default: false

permissions:
  contents: read

# This prefix differs from the release caller's group to avoid self-cancellation.
concurrency:
  group: correctness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      build: ${{ steps.plan.outputs.build }}
      docker: ${{ steps.plan.outputs.docker }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_matrix: ${{ steps.plan.outputs.browser_matrix }}
      studio: ${{ steps.plan.outputs.studio }}
      studio_matrix: ${{ steps.plan.outputs.studio_matrix }}
    steps:
      # The planner reads only Git history and its own scripts. A blobless, sparse
      # clone skips the voice bank, which made a full checkout take 20 to 26 s.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts
            frontend/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select checks from the complete changed-path set
        id: plan
        env:
          CI_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
          CI_FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ "$CI_FULL" = "true" ]; then args+=(--full); fi
          python scripts/ci_plan.py --base "$CI_BASE" --head HEAD "${args[@]}"

  frontend-build:
    name: Frontend build and types
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # One uncompressed archive: the bundle is about 18,000 files, almost all
      # already-compressed recordings, so zipping them file by file only cost time.
      - name: Archive the built frontend
        run: tar -cf frontend-dist.tar dist
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs a balanced half of the test files over its 4 cores. The
        # voice-bank check (about 75 s) runs on the first shard, whose longest group is
        # one course file, and lint on the second, so the two finish closer together.
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Stockfish from the cached package
        uses: ./.github/actions/stockfish
      - name: Install the locked Python environment from cache
        uses: ./.github/actions/python-env
      - name: Lint and format
        if: matrix.shard == '2/2'
        run: |
          ruff check backend scripts migrations
          ruff format --check backend scripts migrations
      - name: Verify the complete recorded voice bank offline
        if: matrix.shard == '1/2'
        run: python -B -S scripts/prepare_coach_voice_bank.py --check
      - name: Run this shard's backend tests in parallel groups
        run: python scripts/pytest_parallel.py --shard "${{ matrix.shard }}" -n 4 -q --durations=10
        env:
          STOCKFISH_PATH: /usr/games/stockfish

  browser:
    name: Browser (${{ matrix.suite }}, ${{ matrix.project }}, ${{ matrix.shard }})
    needs: [changes, frontend-build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-suite
        with:
          config: ${{ matrix.config }}
          project: ${{ matrix.project }}
          shard: ${{ matrix.shard }}
          api: ${{ matrix.api }}
          python: ${{ matrix.python }}
          dist: 'true'
          diagnostics: browser-failure-${{ strategy.job-index }}

  # The studios run on their own Vite dev servers and never load the built
  # frontend, so they start as soon as the plan is known.
  studio-browser:
    name: Browser (${{ matrix.suite }}, ${{ matrix.project }}, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.studio_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/browser-suite
        with:
          config: ${{ matrix.config }}
          project: ${{ matrix.project }}
          shard: ${{ matrix.shard }}
          api: ${{ matrix.api }}
          python: ${{ matrix.python }}
          dist: 'false'
          diagnostics: studio-failure-${{ strategy.job-index }}

  docker-install:
    name: Docker installation
    needs: changes
    if: needs.changes.outputs.docker == 'true' && !inputs.skip_docker_install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build install-check image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fieldwork:install-check
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=min
      - run: python scripts/smoke_install.py --image fieldwork:install-check

  gate:
    name: CI
    if: always()
    needs: [changes, frontend-build, backend, browser, studio-browser, docker-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          sparse-checkout: |
            scripts
            frontend/scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require every selected check to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_SKIP_DOCKER: ${{ inputs.skip_docker_install }}
        run: python scripts/ci_plan.py --check-results
