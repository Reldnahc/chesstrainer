name: correctness
on:
  push:
    branches-ignore: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  docker-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: docker build -t fieldwork:install-check .
      - run: python scripts/smoke_install.py --image fieldwork:install-check
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: python -m pytest -q
        env:
          STOCKFISH_PATH: /usr/games/stockfish
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts migrations
      - run: alembic upgrade head && alembic check
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y stockfish
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock && .venv/bin/pip install --no-deps -e .
      - run: npm ci && npm run build && npx playwright install --with-deps chromium && npx playwright test
        working-directory: frontend
        env:
          STOCKFISH_PATH: /usr/games/stockfish
