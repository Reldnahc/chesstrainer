name: build-and-push

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer release must not race an older image's update of the latest tag.
concurrency:
  group: fieldwork-release
  cancel-in-progress: false

jobs:
  correctness:
    uses: ./.github/workflows/test.yml
    with:
      full: true
      skip_docker_install: true

  docker:
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the release image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ghcr.io/reldnahc/chesstrainer:latest
            ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Reldnahc/chesstrainer
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=fieldwork
          cache-to: type=gha,scope=fieldwork,mode=max
      - name: Smoke-test the exact image to be published
        env:
          IMAGE: ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
        run: python scripts/smoke_install.py --image "$IMAGE"
      - name: Publish the tested image
        env:
          IMAGE: ghcr.io/reldnahc/chesstrainer:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          docker push ghcr.io/reldnahc/chesstrainer:latest
