services:
  fieldwork:
    image: ghcr.io/reldnahc/chesstrainer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-18000}:8000"
    volumes:
      - "${APPDATA_PATH:-fieldwork-data}:/data"
    environment:
      # The container always requires sign-in; no-login mode runs only from source.
      ACCOUNTS_ENABLED: "true"
      # Optional. Blank accepts the address the browser used.
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-}"
      SESSION_SECURE: "${SESSION_SECURE:-true}"
      # Reverse proxy address whose X-Forwarded-For is trusted for sign-in rate limits.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      DATABASE_PATH: /data/trainer.sqlite3
      STOCKFISH_PATH: /usr/games/stockfish
      # cpu needs nothing extra. cuda downloads CUDA PyTorch (about 3 GB) into
      # /data once on first start and needs the GPU reservation below.
      HUMAN_MODEL_DEVICE: "${HUMAN_MODEL_DEVICE:-cpu}"
      PROVIDER_USER_AGENT: "${PROVIDER_USER_AGENT:-FieldworkChessTrainer/0.1}"
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Only /data (and a scratch /tmp) is writable; a process cap contains runaway forks.
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    pids_limit: 1024
    # Optional NVIDIA GPU for Maia (requires the NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
volumes:
  fieldwork-data:
